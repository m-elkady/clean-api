version: "3.8"
services:

  # FrankenPHP service
  backend:
    build:
      context: ./docker/frankenphp
      dockerfile: Dockerfile
    container_name: backend-clean-api
    working_dir: /app
    volumes:
      - ./backend/:/app
    networks:
      - clean-api-network
    ports:
      - "8080:8080"

  # Frontend builder - builds the Vue app to shared volume
  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend/Dockerfile
    container_name: frontend-clean-api
    volumes:
      - frontend-dist:/app/output
      - /frontend/node_modules
    networks:
      - clean-api-network

  # MySQL database service
  db:
    image: mysql:5.7
    container_name: mysql-clean-api
    ports:
      - "3306:3306"
    env_file:
      - ./backend/.env
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD}"
      MYSQL_DATABASE: "${DB_DATABASE}"
      MYSQL_USER: "${DB_USERNAME}"
      MYSQL_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - clean-api-network

  # Nginx service
  nginx:
    image: nginx:alpine
    container_name: nginx-clean-api
    ports:
      - "80:80"
    volumes:
      - ./backend/:/app
      - frontend-dist:/frontend/output
      - ./docker/nginx/:/etc/nginx/conf.d/
      - ./backend/var/log/nginx/:/var/log/nginx/
    networks:
      - clean-api-network
    depends_on:
      - backend
      - frontend

networks:
  clean-api-network:
    driver: bridge

volumes:
  db-data:
  frontend-dist: